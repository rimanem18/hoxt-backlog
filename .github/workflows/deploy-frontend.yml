name: Deploy Frontend

on:
  workflow_call:
    inputs:
      environment-type:
        description: 'Environment type (production or preview)'
        required: false
        type: string
        default: 'production'
      next-public-api-base-url:
        description: 'Next.js API base URL'
        required: true
        type: string
      next-public-site-url:
        description: 'Next.js site URL'
        required: true
        type: string
      next-public-trusted-domains:
        description: 'Next.js trusted domains'
        required: true
        type: string
      cloudflare-worker-name:
        description: 'Cloudflare Worker base name (preview時は -preview が付与される)'
        required: false
        type: string
        default: ''
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
    outputs:
      deployment-url:
        description: 'Cloudflare Workers deployment URL'
        value: ${{ jobs.deploy-frontend.outputs.deployment-url }}

jobs:
  deploy-frontend:
    name: Deploy Frontend Application
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      deployment-url: ${{ steps.deploy.outputs.deployment_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun Workspace
        uses: ./.github/actions/setup-bun-workspace
        with:
          working-directory: './app/client'
          cache-key-suffix: 'frontend'

      - name: Debug Environment Variables
        working-directory: ./app/client
        env:
          INPUT_API_BASE_URL: ${{ inputs.next-public-api-base-url }}
          INPUT_SITE_URL: ${{ inputs.next-public-site-url }}
          INPUT_TRUSTED_DOMAINS: ${{ inputs.next-public-trusted-domains }}
          INPUT_ENV_TYPE: ${{ inputs.environment-type }}
        run: |
          echo "🔍 Frontend Environment Variables Debug:"
          echo "Input next-public-api-base-url: $INPUT_API_BASE_URL"
          echo "Input next-public-site-url: $INPUT_SITE_URL"
          echo "Input next-public-trusted-domains: $INPUT_TRUSTED_DOMAINS"
          echo "Environment type: $INPUT_ENV_TYPE"

      - name: Build Frontend Application
        working-directory: ./app/client
        env:
          # 環境別Next.js設定
          NEXT_PUBLIC_API_BASE_URL: ${{ inputs.next-public-api-base-url }}
          NEXT_PUBLIC_SITE_URL: ${{ inputs.next-public-site-url }}
          NEXT_PUBLIC_TRUSTED_DOMAINS: ${{ inputs.next-public-trusted-domains }}
          # Supabase設定
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          # デモユーザーログイン設定
          NEXT_PUBLIC_DEMO_USER_EMAIL: ${{ vars.NEXT_PUBLIC_DEMO_USER_EMAIL }}
          NEXT_PUBLIC_DEMO_USER_PASSWORD: ${{ vars.NEXT_PUBLIC_DEMO_USER_PASSWORD }}
        run: |
          echo "🔍 Build-time Environment Variables:"
          echo "NEXT_PUBLIC_API_BASE_URL: $NEXT_PUBLIC_API_BASE_URL"
          echo "NEXT_PUBLIC_SITE_URL: $NEXT_PUBLIC_SITE_URL"
          echo "NEXT_PUBLIC_TRUSTED_DOMAINS: $NEXT_PUBLIC_TRUSTED_DOMAINS"
          echo ""
          echo "🚀 Starting Cloudflare Workers build..."
          bun run build:worker

      - name: Deploy to Cloudflare Workers
        id: deploy
        working-directory: ./app/client
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WORKER_NAME_INPUT: ${{ inputs.cloudflare-worker-name }}
          DEFAULT_PROJECT_NAME: ${{ vars.PROJECT_NAME }}
          ENVIRONMENT_TYPE: ${{ inputs.environment-type }}
          FALLBACK_SITE_URL: ${{ inputs.next-public-site-url }}
          # UTF-8ロケール設定でwranglerが日本語コミットメッセージを正しく処理
          LANG: C.UTF-8
        run: |
          # デバッグ: 環境変数の存在確認（値は表示しない）
          echo "=== 環境変数チェック ==="
          [ -n "$CLOUDFLARE_API_TOKEN" ] && echo "✅ CLOUDFLARE_API_TOKEN: 設定済み" || echo "❌ CLOUDFLARE_API_TOKEN: 未設定"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && echo "✅ CLOUDFLARE_ACCOUNT_ID: 設定済み" || echo "❌ CLOUDFLARE_ACCOUNT_ID: 未設定"
          [ -n "$WORKER_NAME_INPUT" ] && echo "✅ WORKER_NAME_INPUT: 設定済み" || echo "⚠️ WORKER_NAME_INPUT: 未設定（デフォルト使用）"
          [ -n "$DEFAULT_PROJECT_NAME" ] && echo "✅ DEFAULT_PROJECT_NAME: 設定済み" || echo "❌ DEFAULT_PROJECT_NAME: 未設定"

          # Worker名のベースを決定（入力がない場合はvarsから取得）
          BASE_NAME="${WORKER_NAME_INPUT:-$DEFAULT_PROJECT_NAME}"
          [ -n "$BASE_NAME" ] && echo "✅ 最終BASE_NAME: 設定済み" || { echo "❌ BASE_NAME: 未設定"; exit 1; }

          # environment-typeの想定外の値でproduction環境へ誤デプロイしないようfail-closed
          case "$ENVIRONMENT_TYPE" in
            production)
              WORKER_NAME="$BASE_NAME"
              ;;
            preview)
              WORKER_NAME="${BASE_NAME}-preview"
              ;;
            *)
              echo "❌ 未知のenvironment-type: $ENVIRONMENT_TYPE"
              exit 1
              ;;
          esac
          echo "✅ WORKER_NAME: $WORKER_NAME"

          # ビルド成果物の確認
          echo ""
          echo "=== .open-next ビルド成果物チェック ==="
          if [ -f ".open-next/worker.js" ] && [ -d ".open-next/assets" ]; then
            echo "✅ .open-next/worker.js および .open-next/assets が存在します"
          else
            echo "❌ .open-next/worker.js または .open-next/assets が存在しません"
            ls -la .open-next/ 2>/dev/null || echo "(.open-next ディレクトリが存在しません)"
            exit 1
          fi

          # デプロイ実行
          echo ""
          echo "=== Cloudflare Workersにデプロイ中... ==="
          if ! DEPLOYMENT_OUTPUT=$(bunx wrangler deploy --name "$WORKER_NAME" 2>&1); then
            echo "❌ デプロイ失敗"
            echo "Output:"
            echo "$DEPLOYMENT_OUTPUT"
            exit 1
          fi

          echo "$DEPLOYMENT_OUTPUT"

          # デプロイメントURLを抽出（wrangler出力から workers.dev で終わるURLのみ取得）
          DEPLOYMENT_URL=$(echo "$DEPLOYMENT_OUTPUT" | grep -oE 'https://[^[:space:]]+\.workers\.dev' | head -1)

          if [ -n "$DEPLOYMENT_URL" ]; then
            echo "✅ デプロイメントURL: $DEPLOYMENT_URL"
          else
            echo "⚠️ workers.dev URLを取得できなかったため、フォールバックURLを使用します"
            DEPLOYMENT_URL="$FALLBACK_SITE_URL"
          fi

          echo "deployment_url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
