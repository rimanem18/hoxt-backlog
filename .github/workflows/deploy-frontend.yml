name: Deploy Frontend

on:
  workflow_call:
    inputs:
      environment-type:
        description: 'Environment type (production or preview)'
        required: false
        type: string
        default: 'production'
      next-public-api-base-url:
        description: 'Next.js API base URL'
        required: true
        type: string
      next-public-site-url:
        description: 'Next.js site URL'
        required: true
        type: string
      next-public-trusted-domains:
        description: 'Next.js trusted domains'
        required: true
        type: string
      cloudflare-project-name:
        description: 'CloudFlare Pages project name'
        required: false
        type: string
        default: ''
    outputs:
      deployment-url:
        description: 'CloudFlare Pages deployment URL'
        value: ${{ jobs.deploy-frontend.outputs.deployment-url }}

jobs:
  deploy-frontend:
    name: Deploy Frontend Application
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      deployment-url: ${{ steps.deploy.outputs.deployment_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun Workspace
        uses: ./.github/actions/setup-bun-workspace
        with:
          working-directory: './app/client'
          cache-key-suffix: 'frontend'

      - name: Debug Environment Variables
        working-directory: ./app/client
        env:
          INPUT_API_BASE_URL: ${{ inputs.next-public-api-base-url }}
          INPUT_SITE_URL: ${{ inputs.next-public-site-url }}
          INPUT_TRUSTED_DOMAINS: ${{ inputs.next-public-trusted-domains }}
          INPUT_ENV_TYPE: ${{ inputs.environment-type }}
        run: |
          echo "🔍 Frontend Environment Variables Debug:"
          echo "Input next-public-api-base-url: $INPUT_API_BASE_URL"
          echo "Input next-public-site-url: $INPUT_SITE_URL"
          echo "Input next-public-trusted-domains: $INPUT_TRUSTED_DOMAINS"
          echo "Environment type: $INPUT_ENV_TYPE"

      - name: Build Frontend Application
        working-directory: ./app/client
        env:
          # 環境別Next.js設定
          NEXT_PUBLIC_API_BASE_URL: ${{ inputs.next-public-api-base-url }}
          NEXT_PUBLIC_SITE_URL: ${{ inputs.next-public-site-url }}
          NEXT_PUBLIC_TRUSTED_DOMAINS: ${{ inputs.next-public-trusted-domains }}
          # Supabase設定
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          echo "🔍 Build-time Environment Variables:"
          echo "NEXT_PUBLIC_API_BASE_URL: $NEXT_PUBLIC_API_BASE_URL"
          echo "NEXT_PUBLIC_SITE_URL: $NEXT_PUBLIC_SITE_URL"
          echo "NEXT_PUBLIC_TRUSTED_DOMAINS: $NEXT_PUBLIC_TRUSTED_DOMAINS"
          echo ""
          echo "🚀 Starting Next.js build..."
          bun run build

      - name: Deploy to CloudFlare Pages
        id: deploy
        working-directory: ./app/client
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_INPUT: ${{ inputs.cloudflare-project-name }}
          DEFAULT_PROJECT_NAME: ${{ vars.PROJECT_NAME }}
          # UTF-8ロケール設定でwranglerが日本語コミットメッセージを正しく処理
          LANG: C.UTF-8
        run: |
          # デバッグ: 環境変数の存在確認（値は表示しない）
          echo "=== 環境変数チェック ==="
          [ -n "$CLOUDFLARE_API_TOKEN" ] && echo "✅ CLOUDFLARE_API_TOKEN: 設定済み" || echo "❌ CLOUDFLARE_API_TOKEN: 未設定"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && echo "✅ CLOUDFLARE_ACCOUNT_ID: 設定済み" || echo "❌ CLOUDFLARE_ACCOUNT_ID: 未設定"
          [ -n "$CLOUDFLARE_PROJECT_INPUT" ] && echo "✅ CLOUDFLARE_PROJECT_INPUT: 設定済み" || echo "⚠️ CLOUDFLARE_PROJECT_INPUT: 未設定（デフォルト使用）"
          [ -n "$DEFAULT_PROJECT_NAME" ] && echo "✅ DEFAULT_PROJECT_NAME: 設定済み" || echo "❌ DEFAULT_PROJECT_NAME: 未設定"

          # プロジェクト名を決定（入力がない場合はvarsから取得）
          PROJECT_NAME="${CLOUDFLARE_PROJECT_INPUT:-$DEFAULT_PROJECT_NAME}"
          [ -n "$PROJECT_NAME" ] && echo "✅ 最終PROJECT_NAME: 設定済み" || { echo "❌ PROJECT_NAME: 未設定"; exit 1; }

          # outディレクトリの確認
          echo ""
          echo "=== out ディレクトリチェック ==="
          if [ -d "out" ]; then
            echo "✅ out/ ディレクトリ存在"
            ls -la out/ | head -5
          else
            echo "❌ out/ ディレクトリが存在しません"
            ls -la
            exit 1
          fi

          # デプロイ実行
          echo ""
          echo "=== CloudFlare Pagesにデプロイ中... ==="
          if ! DEPLOYMENT_OUTPUT=$(npx --yes wrangler@4.61.0 pages deploy out \
            --project-name "$PROJECT_NAME" \
            --branch "${{ github.ref_name == 'main' && 'main' || 'preview' }}" \
            --commit-dirty=true 2>&1); then
            echo "❌ デプロイ失敗"
            echo "Output:"
            echo "$DEPLOYMENT_OUTPUT"
            exit 1
          fi

          echo "$DEPLOYMENT_OUTPUT"

          # デプロイメントURLを抽出（wrangler出力から .pages.dev で終わるURLのみ取得）
          DEPLOYMENT_URL=$(echo "$DEPLOYMENT_OUTPUT" | grep -o 'https://[^[:space:]]*\.pages\.dev' | head -1)

          if [ -n "$DEPLOYMENT_URL" ]; then
            echo "✅ デプロイメントURL: $DEPLOYMENT_URL"
            echo "deployment_url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          else
            echo "⚠️ デプロイメントURLを取得できませんでした"
            echo "deployment_url=" >> "$GITHUB_OUTPUT"
          fi
