name: E2E Test

on:
  workflow_call:
    inputs:
      concurrency_suffix:
        description: 'Concurrency group suffix from parent'
        required: false
        type: string
      cancel_in_progress:
        description: 'Cancel in progress runs'
        required: false
        type: boolean
        default: true
      ref:
        description: 'Git ref to checkout (defaults to the caller workflow ref)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    services:
      db:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -p 5432 -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 5s

    container:
      image: mcr.microsoft.com/playwright:v1.61.1-jammy
      options: --shm-size=1gb
      env:
        CI: true
        HOME: /root  # Fix Firefox launch issue in GitHub Actions

    concurrency:
      group: ${{ inputs.concurrency_suffix && format('e2e-{0}', inputs.concurrency_suffix) || format('e2e-{0}', github.ref) }}
      cancel-in-progress: ${{ inputs.cancel_in_progress }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('app/client/bun.lock', 'app/client/package.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Cache apt packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            /var/cache/apt/archives
            /var/lib/apt/lists
          key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/e2e-test.yml') }}
          restore-keys: |
            apt-${{ runner.os }}-

      - name: Install required tools and fix Firefox HOME issue
        run: |
          apt-get update
          apt-get install -y unzip
          # Fix Firefox HOME issue by setting proper ownership
          export HOME=/root
          echo "HOME=/root" >> $GITHUB_ENV

      - name: Setup Bun Environment for Client
        uses: ./.github/actions/setup-bun
        with:
          working-directory: ./app/client
          cache-key-suffix: e2e-client

      - name: Setup PostgreSQL Environment
        uses: ./.github/actions/setup-postgres
        with:
          db-host: db
          db-name: postgres
          db-user: postgres
          db-password: test_password

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.x'

      - name: Install server dependencies
        working-directory: ./app/server
        run: |
          bun install --frozen-lockfile
          npm install

      - name: Run database migrations
        working-directory: ./app/server
        env:
          DB_HOST: db
          DB_PORT: 5432
          DB_NAME: postgres
          DB_USER: postgres
          DB_PASSWORD: test_password
          BASE_SCHEMA: test_schema
          DATABASE_URL: postgresql://postgres:test_password@db:5432/postgres
        run: |
          set -e

          echo "--- Installing PostgreSQL client ---"
          apt-get update && apt-get install -y postgresql-client

          echo "--- Waiting for PostgreSQL to be ready ---"
          for i in $(seq 1 30); do
            if pg_isready -h $DB_HOST -p $DB_PORT -U $DB_USER; then
              echo "PostgreSQL is ready!"
              break
            fi
            echo "Waiting for PostgreSQL... (attempt $i/30)"
            sleep 2
          done

          echo "=== Create schema ==="
          PGPASSWORD=$DB_PASSWORD psql -h $DB_HOST -p $DB_PORT -U $DB_USER -d $DB_NAME -c "CREATE SCHEMA IF NOT EXISTS $BASE_SCHEMA"

          echo "=== Drizzle push ==="
          bunx drizzle-kit push --config=drizzle.config.ts --force

          echo "=== Database schema setup (RLS/triggers) ==="
          bun run db:setup

      - name: Start services and run E2E tests
        env:
          CLIENT_PORT: 3000
          SERVER_PORT: 3001
          NEXT_PUBLIC_API_BASE_URL: "http://localhost:3001"
          # docker-composeを使わずserver/clientを直接起動するため、サービス名DNSの
          # 代わりにlocalhostを指定する（app/client/e2e/viewer/helpers/constants.ts）
          E2E_SERVER_BASE_URL: "http://localhost:3001"
          # Supabase test environment variables (mocked)
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test_publishable_key
          # Additional client environment variables from compose.yaml
          NEXT_PUBLIC_TRUSTED_DOMAINS: localhost:3000,localhost:3001
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
        run: |
          set -e

          echo "--- Starting server in background (Node.js runtime) ---"
          cd ./app/server
          SERVER_PORT=3001 \
          ENVIRONMENT=development \
          ENABLE_TEST_ENDPOINTS=true \
          ACCESS_ALLOW_ORIGIN=http://localhost:3000 \
          ACCESS_ALLOW_METHODS=GET,POST,PUT,DELETE,OPTIONS \
          ACCESS_ALLOW_HEADERS=Authorization,Content-Type,Viewer-Access-Token \
          SUPABASE_URL=http://localhost:54321 \
          SUPABASE_PUBLISHABLE_KEY=test_publishable_key \
          DB_HOST=db \
          DB_PORT=5432 \
          DB_NAME=postgres \
          DB_USER=postgres \
          DB_PASSWORD=test_password \
          BASE_SCHEMA=test_schema \
          DATABASE_URL=postgresql://postgres:test_password@db:5432/postgres \
          DB_CONNECT_TIMEOUT_SECONDS=3 \
          DB_IDLE_TIMEOUT_SECONDS=10 \
          DB_MAX_CONNECTIONS=5 \
          npm run start:node &
          SERVER_PID=$!
          cd ../..
          
          echo "--- Starting client in background ---"
          cd ./app/client
          bun run dev &
          CLIENT_PID=$!
          cd ../..
          
          echo "--- Waiting for services to be ready ---"
          for i in $(seq 1 30); do
            if ! kill -0 $SERVER_PID 2>/dev/null; then
              echo "Server process exited unexpectedly. Aborting wait."
              exit 1
            fi
            if ! kill -0 $CLIENT_PID 2>/dev/null; then
              echo "Client process exited unexpectedly. Aborting wait."
              exit 1
            fi
            if curl -f http://localhost:3000 >/dev/null 2>&1 && \
               curl -f http://localhost:3001/api/health >/dev/null 2>&1; then
              echo "All services are ready!"
              break
            fi
            echo "Waiting for services... (attempt $i/30)"
            if [ $i -lt 10 ]; then
              sleep 2
            else
              sleep 5
            fi
          done
          
          echo "--- Running Playwright tests ---"
          cd ./app/client
          bun run test:e2e
          
          # Cleanup background processes
          kill $SERVER_PID $CLIENT_PID || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: app/client/playwright-report/
          retention-days: 30