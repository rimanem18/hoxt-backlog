name: Preview Environment Deployment

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

# セキュリティ: Fork制限（NFR-005準拠）
permissions:
  id-token: write
  contents: read
  pull-requests: write  # プレビューURL コメント用

concurrency:
  group: preview-shared-environment
  # Terraform適用中に強制キャンセルするとS3/DynamoDB間でstateの整合性が壊れるため、
  # キャンセルせずキューイングして直列実行する
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-1

jobs:
  # Fork制限チェック（セキュリティ）
  security-check:
    name: Security Check
    runs-on: ubuntu-latest
    outputs:
      is-fork: ${{ steps.fork.outputs.is-fork }}
      can-deploy: ${{ steps.fork.outputs.can-proceed }}
    steps:
      - name: Determine checkout ref for fork safety
        id: checkout_ref
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          IS_FORK_CHECK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            IS_FORK="$IS_FORK_CHECK"
            if [ "$IS_FORK" = "true" ]; then
              # Fork PR: main ブランチを使用（改ざん対策）
              echo "ref=$PR_BASE_SHA" >> "$GITHUB_OUTPUT"
              echo "📌 Fork PR detected: using base branch for security"
            else
              # 同一リポジトリ PR: マージコミットを使用（実際のPR挙動を再現）
              echo "ref=$CURRENT_SHA" >> "$GITHUB_OUTPUT"
              echo "📌 Same-repo PR: using merge commit"
            fi
          else
            # push/workflow_dispatch: 現在のコミット（実際のマージ挙動を再現）
            echo "ref=$CURRENT_SHA" >> "$GITHUB_OUTPUT"
            echo "📌 Non-PR event: using current commit"
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.checkout_ref.outputs.ref }}
          persist-credentials: false

      - name: Check Fork Status
        id: fork
        uses: ./.github/actions/fork-check

  # TruffleHog Secret Scanning（セキュリティゲート）
  trufflehog:
    name: TruffleHog Secret Scan
    needs: security-check
    if: needs.security-check.outputs.can-deploy == 'true'
    runs-on: ubuntu-latest
    outputs:
      severity: ${{ steps.scan.outputs.severity }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0  # Git履歴全スキャンのため全履歴取得

      - name: Run TruffleHog Scan
        id: scan
        uses: ./.github/actions/trufflehog-scan
        with:
          base-branch: ${{ github.event.repository.default_branch }}

      - name: Check Critical Findings
        if: steps.scan.outputs.severity == 'critical'
        run: |
          echo "❌ Critical: 検証済みシークレットが検出されました"
          exit 1

  # Semgrep SAST（セキュリティゲート）
  semgrep:
    name: Semgrep SAST Scan
    needs: security-check
    if: needs.security-check.outputs.can-deploy == 'true'
    runs-on: ubuntu-latest
    outputs:
      severity: ${{ steps.scan.outputs.severity }}
      high_critical_count: ${{ steps.scan.outputs.high_critical_count }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run Semgrep Scan
        id: scan
        uses: ./.github/actions/semgrep-scan

      - name: Check Critical Findings
        if: steps.scan.outputs.severity == 'critical'
        run: |
          echo "❌ Critical: High/Critical の脆弱性が ${HIGH_CRITICAL_COUNT} 件検出されました"
          exit 1
        env:
          HIGH_CRITICAL_COUNT: ${{ steps.scan.outputs.high_critical_count }}

  # 型定義最新性チェック
  schema-check:
    name: Schema Check
    needs: security-check
    if: needs.security-check.outputs.can-deploy == 'true'
    uses: ./.github/workflows/schema-check.yml

  # Client テスト実行
  client-test:
    name: Run Client Tests
    if: needs.security-check.outputs.can-deploy == 'true'
    needs: [security-check]
    uses: ./.github/workflows/client-test.yml
    with:
      working-directory: ./app/client

  # Server テスト実行（並列）
  server-test:
    name: Run Server Tests
    if: needs.security-check.outputs.can-deploy == 'true'
    needs: [security-check]
    uses: ./.github/workflows/server-test.yml
    with:
      working-directory: ./app/server

  # E2E テスト実行（並列）
  e2e-test:
    name: Run E2E Tests
    if: needs.security-check.outputs.can-deploy == 'true'
    needs: [security-check]
    uses: ./.github/workflows/e2e-test.yml
    with:
      concurrency_suffix: 'preview-pr-${{ github.event.pull_request.number }}'
      cancel_in_progress: true

  # デプロイ開始ログ
  log-deployment-start:
    name: Log Preview Deployment Start
    if: |
      needs.security-check.outputs.can-deploy == 'true' &&
      needs.client-test.result == 'success' &&
      needs.server-test.result == 'success' &&
      needs.e2e-test.result == 'success' &&
      needs.trufflehog.result == 'success' &&
      needs.semgrep.result == 'success'
    needs: [security-check, client-test, server-test, e2e-test, trufflehog, semgrep]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      
      - name: Record Preview Deployment Start
        uses: ./.github/actions/deployment-logger
        with:
          event-type: 'start'
          component: 'preview-environment'
          environment: 'preview'
          details: 'Starting preview environment deployment for PR #${{ github.event.pull_request.number }} (tests passed)'

  # Phase 1: インフラストラクチャ（Preview環境）
  deploy-infrastructure:
    name: Deploy Preview Infrastructure
    if: |
      needs.security-check.outputs.can-deploy == 'true' &&
      needs.schema-check.result == 'success' &&
      needs.client-test.result == 'success' &&
      needs.server-test.result == 'success' &&
      needs.e2e-test.result == 'success' &&
      needs.trufflehog.result == 'success' &&
      needs.semgrep.result == 'success'
    needs: [security-check, schema-check, client-test, server-test, e2e-test, trufflehog, semgrep, log-deployment-start]
    uses: ./.github/workflows/deploy-infra.yml
    with:
      terraform-version: 1.6.1
      aws-region: ap-northeast-1
      environment-type: 'preview'
    secrets:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OPS_EMAIL: ${{ secrets.OPS_EMAIL }}

  # Phase 2: データベース（Preview schema）- Frontendと並列実行
  deploy-database:
    name: Deploy Preview Database
    if: |
      needs.security-check.outputs.can-deploy == 'true' &&
      needs.schema-check.result == 'success' &&
      needs.client-test.result == 'success' &&
      needs.server-test.result == 'success' &&
      needs.e2e-test.result == 'success' &&
      needs.trufflehog.result == 'success' &&
      needs.semgrep.result == 'success'
    needs: [security-check, schema-check, client-test, server-test, e2e-test, trufflehog, semgrep, deploy-infrastructure]
    uses: ./.github/workflows/deploy-database.yml
    with:
      timeout-minutes: 10
      environment-type: 'preview'
    secrets:
      DATABASE_URL_MIGRATE: ${{ secrets.DATABASE_URL_MIGRATE }}
      DATABASE_URL_MIGRATE_PREVIEW: ${{ secrets.DATABASE_URL_MIGRATE_PREVIEW }}

  # Phase 3: バックエンド（Preview Lambda）- Database完了後
  deploy-backend:
    name: Deploy Preview Backend
    if: |
      needs.security-check.outputs.can-deploy == 'true' &&
      needs.schema-check.result == 'success' &&
      needs.client-test.result == 'success' &&
      needs.server-test.result == 'success' &&
      needs.e2e-test.result == 'success' &&
      needs.trufflehog.result == 'success' &&
      needs.semgrep.result == 'success'
    needs: [security-check, schema-check, client-test, server-test, e2e-test, trufflehog, semgrep, deploy-infrastructure, deploy-database]
    uses: ./.github/workflows/deploy-backend.yml
    with:
      lambda-function-name: ${{ needs.deploy-infrastructure.outputs.lambda-function-name-preview }}
      environment-type: 'preview'
      aws-region: ap-northeast-1
      cors-allow-origin: ${{ needs.deploy-infrastructure.outputs.access-allow-origin-preview }}
    secrets:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

  # Phase 2: フロントエンド（Preview Pages）- Database/Backendと並列実行
  deploy-frontend:
    name: Deploy Preview Frontend
    if: |
      needs.security-check.outputs.can-deploy == 'true' &&
      needs.schema-check.result == 'success' &&
      needs.client-test.result == 'success' &&
      needs.server-test.result == 'success' &&
      needs.e2e-test.result == 'success' &&
      needs.trufflehog.result == 'success' &&
      needs.semgrep.result == 'success'
    needs: [security-check, schema-check, client-test, server-test, e2e-test, trufflehog, semgrep, deploy-infrastructure]
    uses: ./.github/workflows/deploy-frontend.yml
    with:
      environment-type: 'preview'
      next-public-api-base-url: ${{ needs.deploy-infrastructure.outputs.next-public-api-base-url-preview }}
      next-public-site-url: ${{ needs.deploy-infrastructure.outputs.next-public-site-url-preview }}
      next-public-trusted-domains: ${{ needs.deploy-infrastructure.outputs.next-public-trusted-domains-preview }}
      cloudflare-worker-name: ${{ vars.PROJECT_NAME }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  # デプロイ完了ログ
  log-deployment-result:
    name: Log Preview Deployment Result
    if: |
      always() &&
      needs.security-check.outputs.can-deploy == 'true' &&
      needs.client-test.result == 'success' &&
      needs.server-test.result == 'success' &&
      needs.e2e-test.result == 'success' &&
      needs.trufflehog.result == 'success' &&
      needs.semgrep.result == 'success'
    needs: [security-check, schema-check, client-test, server-test, e2e-test, trufflehog, semgrep, deploy-infrastructure, deploy-database, deploy-backend, deploy-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      
      - name: Record Preview Deployment Success
        if: needs.deploy-frontend.result == 'success'
        uses: ./.github/actions/deployment-logger
        with:
          event-type: 'success'
          component: 'preview-environment'
          environment: 'preview'
          details: 'Preview environment deployed successfully for PR #${{ github.event.pull_request.number }}'

      - name: Record Preview Deployment Failure
        if: needs.deploy-frontend.result == 'failure' || needs.deploy-backend.result == 'failure' || needs.deploy-database.result == 'failure' || needs.deploy-infrastructure.result == 'failure'
        uses: ./.github/actions/deployment-logger
        with:
          event-type: 'failure'
          component: 'preview-environment'
          environment: 'preview'
          details: 'Preview environment deployment failed for PR #${{ github.event.pull_request.number }}'

  # プレビューURL コメント
  comment-preview-urls:
    name: Comment Preview URLs
    if: |
      needs.security-check.outputs.can-deploy == 'true' &&
      needs.schema-check.result == 'success' &&
      needs.client-test.result == 'success' &&
      needs.server-test.result == 'success' &&
      needs.e2e-test.result == 'success' &&
      needs.trufflehog.result == 'success' &&
      needs.semgrep.result == 'success' &&
      needs.deploy-infrastructure.result == 'success' &&
      needs.deploy-database.result == 'success' &&
      needs.deploy-backend.result == 'success' &&
      needs.deploy-frontend.result == 'success'
    needs: [security-check, schema-check, client-test, server-test, e2e-test, trufflehog, semgrep, deploy-infrastructure, deploy-database, deploy-backend, deploy-frontend]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment Preview URLs
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          FRONTEND_URL: ${{ needs.deploy-infrastructure.outputs.next-public-site-url-preview }}
          API_URL: ${{ needs.deploy-infrastructure.outputs.next-public-api-base-url-preview }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
          PR_REF: ${{ github.event.pull_request.head.ref }}
        with:
          script: |
            // URL正規化処理
            const frontendUrl = process.env.FRONTEND_URL;
            const apiUrl = process.env.API_URL;
            const healthUrl = apiUrl.replace(/\/$/, '') + '/api/health'; // 正しいAPIエンドポイントパス

            const previewComment = `## 🚀 Preview Environment Ready!

            ### 📱 Preview URLs
            - **🌐 Frontend**: ${frontendUrl}
            - **🔗 API**: ${apiUrl}

            ### 🧪 Quick Tests
            - [Health Check](${healthUrl})
            - [Frontend App](${frontendUrl})

            ### ℹ️ Environment Info
            - **PR**: #${process.env.PR_NUMBER}
            - **Commit**: ${process.env.PR_SHA}
            - **Branch**: ${process.env.PR_REF}

            > 🔄 Preview environment will be automatically updated when you push new commits to this PR.
            > ⚠️ **Shared Environment**: This preview environment is shared across all PRs. The latest PR update will overwrite previous deployments.`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: previewComment,
            });

  # Fork警告コメント
  comment-fork-warning:
    name: Comment Fork Warning
    if: needs.security-check.outputs.can-deploy == 'false'
    needs: [security-check]
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Comment Fork Warning
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const forkWarning = `## ⚠️ Preview Environment Unavailable

            This pull request is from a forked repository. For security reasons, preview environments are not deployed for external contributions.

            ### 🔒 Security Policy
            - Preview deployments are restricted to same-repository PRs only
            - This prevents potential security risks from untrusted code execution

            ### ✅ What's Still Available
            - All automated tests will run normally
            - Code review process remains unchanged
            - Manual testing can be performed after merge approval

            Thank you for your contribution! 🙏`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: forkWarning,
            });